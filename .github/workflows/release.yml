name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish client (self-contained win-x64)
        run: >
          dotnet publish Client/Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/client

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/client/* -DestinationPath "Messenger-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DMyAppVersion=${{ steps.version.outputs.version }}"
          installer/Messenger.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Messenger-${{ steps.version.outputs.version }}-win-x64.zip
            installer/Output/Messenger-Setup.exe
